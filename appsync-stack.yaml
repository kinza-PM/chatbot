AWSTemplateFormatVersion: '2010-09-09'
Description: 'AppSync GraphQL API for real-time support chat'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name

Resources:
  ###########################
  ### AppSync API
  ###########################
  AppSyncAPI:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub 'support-chat-api-${Environment}'
      AuthenticationType: API_KEY
      LogConfig:
        CloudWatchLogsRoleArn: !GetAtt AppSyncLogsRole.Arn
        FieldLogLevel: ERROR

  AppSyncAPIKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      Description: API Key for support chat

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      Definition: |
        type Message {
          id: ID!
          conversationId: ID!
          sender: String!
          text: String!
          timestamp: String!
          status: String
        }
        type Conversation {
          conversationId: ID!
          userId: String
          email: String!
          name: String!
          phone: String!
          category: String
          subcategory: String
          messages: [Message!]!
          ticketId: String
          status: String!
          createdAt: String!
          updatedAt: String!
        }
        input SendMessageInput {
          conversationId: ID!
          message: String!
          sender: String!
        }
        
        # Ticket Event Types
        type TicketCreatedEvent {
          ticketId: ID!
          name: String!
          email: String!
          reason: String!
          status: String!
          createdAt: String!
        }
        
        type TicketUpdatedEvent {
          ticketId: ID!
          changes: String!
          updatedAt: String!
        }
        
        input TicketCreatedInput {
          ticketId: String!
          name: String!
          email: String!
          reason: String!
          status: String!
          createdAt: String!
        }
        
        input TicketUpdatedInput {
          ticketId: String!
          changes: String!
          updatedAt: String!
        }
        
        type Query {
          getConversation(conversationId: ID!): Conversation
        }
        type Mutation {
          sendMessage(input: SendMessageInput!): Message
          updateConversationStatus(conversationId: ID!, status: String!): Conversation
          publishTicketCreated(input: TicketCreatedInput!): TicketCreatedEvent
          publishTicketUpdated(input: TicketUpdatedInput!): TicketUpdatedEvent
        }
        type Subscription {
          onMessageReceived(conversationId: ID!): Message
            @aws_subscribe(mutations: ["sendMessage"])
          onConversationStatusChanged(conversationId: ID!): Conversation
            @aws_subscribe(mutations: ["updateConversationStatus"])
          onTicketCreated: TicketCreatedEvent
            @aws_subscribe(mutations: ["publishTicketCreated"])
          onTicketUpdated: TicketUpdatedEvent
            @aws_subscribe(mutations: ["publishTicketUpdated"])
        }

  ###########################
  ### AppSync Data Sources
  ###########################
  DynamoDBDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      Name: SupportConversationsTable
      Type: AMAZON_DYNAMODB
      DynamoDBConfig:
        AwsRegion: !Ref AWS::Region
        TableName: !Sub 'support-conversations-${Environment}'
      ServiceRoleArn: !GetAtt AppSyncDynamoDBRole.Arn

  LambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      Name: AppSyncResolver
      Type: AWS_LAMBDA
      LambdaConfig:
        LambdaFunctionArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:al-rais-chatbot-${Environment}-appSyncResolver'
      ServiceRoleArn: !GetAtt AppSyncLambdaRole.Arn

  ###########################
  ### Ticket Events AppSync API
  ###########################
  TicketEventsApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: ticket-events-api-${Environment}
      AuthenticationType: API_KEY
      ApiKeyConfig:
        Description: API Key for ticket events
        Expires: 365

  TicketEventsApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      Description: API Key for ticket events

  TicketEventsSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      Definition: |
        type Query {
          dummy: String
        }

        type Mutation {
          publishTicketCreated(input: TicketCreatedInput!): TicketCreatedEvent
          publishTicketUpdated(input: TicketUpdatedInput!): TicketUpdatedEvent
        }

        type Subscription {
          onTicketCreated: TicketCreatedEvent
            @aws_subscribe(mutations: ["publishTicketCreated"])
          onTicketUpdated: TicketUpdatedEvent
            @aws_subscribe(mutations: ["publishTicketUpdated"])
        }

        input TicketCreatedInput {
          ticketId: String!
          name: String!
          email: String!
          reason: String!
          status: String!
          createdAt: String!
        }

        type TicketCreatedEvent {
          ticketId: String!
          name: String!
          email: String!
          reason: String!
          status: String!
          createdAt: String!
        }

        input TicketUpdatedInput {
          ticketId: String!
          changes: String!
          updatedAt: String!
        }

        type TicketUpdatedEvent {
          ticketId: String!
          changes: String!
          updatedAt: String!
        }

  TicketCreatedDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      Name: TicketCreatedDataSource
      Type: NONE

  TicketUpdatedDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      Name: TicketUpdatedDataSource
      Type: NONE

  PublishTicketCreatedResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: TicketEventsSchema
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      TypeName: Mutation
      FieldName: publishTicketCreated
      DataSourceName: !GetAtt TicketCreatedDataSource.Name
      Kind: UNIT
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "payload": $util.toJson($input)
        }
      ResponseMappingTemplate: |
        $util.toJson($payload)

  PublishTicketUpdatedResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: TicketEventsSchema
    Properties:
      ApiId: !GetAtt TicketEventsApi.ApiId
      TypeName: Mutation
      FieldName: publishTicketUpdated
      DataSourceName: !GetAtt TicketUpdatedDataSource.Name
      Kind: UNIT
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "payload": $util.toJson($input)
        }
      ResponseMappingTemplate: |
        $util.toJson($payload)

  ###########################
  ### AppSync Resolvers
  ###########################
  GetConversationResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      TypeName: Query
      FieldName: getConversation
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Invoke",
          "payload": {
            "typeName": "Query",
            "fieldName": "getConversation",
            "arguments": $util.toJson($context.arguments),
            "identity": $util.toJson($context.identity),
            "source": $util.toJson($context.source),
            "request": $util.toJson($context.request),
            "prev": $util.toJson($context.prev)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)

  SendMessageResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      TypeName: Mutation
      FieldName: sendMessage
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Invoke",
          "payload": {
            "typeName": "Mutation",
            "fieldName": "sendMessage",
            "arguments": $util.toJson($context.arguments),
            "identity": $util.toJson($context.identity),
            "source": $util.toJson($context.source),
            "request": $util.toJson($context.request),
            "prev": $util.toJson($context.prev)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)

  UpdateConversationStatusResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncAPI.ApiId
      TypeName: Mutation
      FieldName: updateConversationStatus
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Invoke",
          "payload": {
            "typeName": "Mutation",
            "fieldName": "updateConversationStatus",
            "arguments": $util.toJson($context.arguments),
            "identity": $util.toJson($context.identity),
            "source": $util.toJson($context.source),
            "request": $util.toJson($context.request),
            "prev": $util.toJson($context.prev)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)

  ###########################
  ### IAM Roles for AppSync
  ###########################
  AppSyncLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  AppSyncDynamoDBRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/support-conversations-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/support-conversations-${Environment}/index/*'

  AppSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:al-rais-chatbot-${Environment}-appSyncResolver'

Outputs:
  GraphQLApiId:
    Description: GraphQL API ID
    Value: !GetAtt AppSyncAPI.ApiId
    Export:
      Name: !Sub 'AppSyncApiId-${Environment}'

  GraphQLApiEndpoint:
    Description: GraphQL API Endpoint
    Value: !GetAtt AppSyncAPI.GraphQLDns
    Export:
      Name: !Sub 'AppSyncEndpoint-${Environment}'

  GraphQLApiKey:
    Description: GraphQL API Key
    Value: !GetAtt AppSyncAPIKey.ApiKey
    Export:
      Name: !Sub 'AppSyncApiKey-${Environment}'

  TicketEventsApiEndpoint:
    Description: Ticket Events AppSync GraphQL Endpoint
    Value: !Sub 'https://${TicketEventsApi.GraphQLEndpoint}'
    Export:
      Name: !Sub 'TicketEventsApiEndpoint-${Environment}'

  TicketEventsApiKey:
    Description: API Key for Ticket Events AppSync API
    Value: !GetAtt TicketEventsApiKey.ApiKey
    Export:
      Name: !Sub 'TicketEventsApiKey-${Environment}'
