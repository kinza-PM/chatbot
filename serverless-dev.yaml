service: al-rais-chatbot
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: false

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/chat-conversations-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/chat-conversations-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/support-conversations-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/support-conversations-${self:provider.stage}/index/*

  environment:
    STAGE: ${self:provider.stage}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
    COGNITO_USERPOOL_ID: ${env:COGNITO_USERPOOL_ID, ''}
    COGNITO_REGION: "${aws:region}"
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_MODEL: "gpt-4o"
    CONVERSATIONS_TABLE: chat-conversations-${self:provider.stage}
    SUPPORT_CONVERSATIONS_TABLE: support-conversations-${self:provider.stage}
    MAIN_ENDPOINT: ${env:MAIN_ENDPOINT, 'http://localhost:3000'}
    FLIGHT_API_BASE: ${env:MAIN_ENDPOINT, 'http://localhost:3000'}
    HOTEL_API_BASE: ${env:MAIN_ENDPOINT, 'http://localhost:3000'}
    TRANSPORT_API_BASE: ${env:MAIN_ENDPOINT, 'http://localhost:3000'}
    SUPPORT_API_BASE: ${env:SUPPORT_API_BASE, 'https://roj8jj0e3h.execute-api.${aws:region}.amazonaws.com/dev'}
    MASTERLISTING_API_BASE: ${env:MASTERLISTING_API_BASE, 'https://ie7eaxnxpg.execute-api.${aws:region}.amazonaws.com/dev'}
    
package:
  patterns:
    - '!./**'
    - handlers/**
    - helper/**
    - lib/**
    - package.json
    - package-lock.json
    - node_modules/**
    - '!node_modules/aws-sdk/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/docs/**'
    - '!node_modules/**/examples/**'
    - '!node_modules/**/*.md'
    - '!node_modules/**/*.ts'
    - '!node_modules/**/*.map'
  excludeDevDependencies: true

functions:
  # Main Chat Endpoint
  chat:
    handler: handlers/chat.handler
    timeout: 60
    memorySize: 512
    events:
      - http:
          path: /chat
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # Get Chat History / List Conversations
  getChatHistory:
    handler: handlers/getChatHistory.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /chat/history
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # Delete Conversation
  deleteConversation:
    handler: handlers/deleteConversation.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /chat/{conversationId}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # Get Categories
  getCategories:
    handler: handlers/getCategories.handler
    timeout: 30
    memorySize: 256
    events:
      - http:
          path: /categories
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # Support Ticket Creation
  supportTicket:
    handler: handlers/supportTicket.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /support/ticket
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # AppSync Resolver
  appSyncResolver:
    handler: handlers/appSyncResolver.handler
    timeout: 30
    memorySize: 512
    environment:
      SUPPORT_CONVERSATIONS_TABLE: ${self:provider.environment.SUPPORT_CONVERSATIONS_TABLE}
      SUPPORT_API_BASE: ${self:provider.environment.SUPPORT_API_BASE}

plugins:
  - serverless-dotenv-plugin
  - serverless-appsync-plugin
  - serverless-offline

appSync:
  name: support-chat-api-${self:provider.stage}
  authenticationType: API_KEY
  apiKeys:
    - name: default
      description: Default API Key for support chat
      expiresAfter: 365d
  
  schema: schema.graphql
  
  dataSources:
    - type: AMAZON_DYNAMODB
      name: SupportConversationsTable
      description: Support Conversations DynamoDB Table
      config:
        tableName: support-conversations-${self:provider.stage}
    
    - type: AWS_LAMBDA
      name: AppSyncResolverLambda
      description: Lambda function for AppSync resolvers
      config:
        functionArn:
          Fn::GetAtt:
            - AppSyncResolverLambdaFunction
            - Arn
  
  resolvers:
    # Query Resolvers
    - type: Query
      field: getConversation
      dataSource: SupportConversationsTable
      request: resolvers/Query.getConversation.request.vtl
      response: resolvers/Query.getConversation.response.vtl
    
    # Mutation Resolvers
    - type: Mutation
      field: sendMessage
      dataSource: AppSyncResolverLambda
      request: resolvers/Mutation.sendMessage.request.vtl
      response: resolvers/Mutation.sendMessage.response.vtl
    
    - type: Mutation
      field: updateConversationStatus
      dataSource: SupportConversationsTable
      request: resolvers/Mutation.updateConversationStatus.request.vtl
      response: resolvers/Mutation.updateConversationStatus.response.vtl
  
  logConfig:
    loggingRoleArn:
      Fn::GetAtt:
        - AppSyncLoggingRole
        - Arn
    level: ERROR
    excludeVerboseContent: false

resources:
  Resources:

    ###########################
    ### AppSync IAM Role
    ###########################
    AppSyncLoggingRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: appsync.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSAppSyncPushToCloudWatchLogs

    ###########################
    ### DynamoDB Tables
    ###########################
    ChatConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: chat-conversations-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: updatedAt
            AttributeType: S
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: updatedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    SupportConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: support-conversations-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

